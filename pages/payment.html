    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="../src/assets/bootstrap/bootstrap.min.css" />
    <script src="../src/assets/bootstrap/bootstrap.bundle.min.js" defer></script>

    <!-- custom css link -->
    <link rel="stylesheet" href="../src/assets/css/styles.css" />

    <!-- custom js link -->
    <script src="../src/js/aos.js" type="module"></script>
    <script src="../src/js/app.js" type="module"></script>

</head>

<body>

    <!-- Payment -->
    <article class="payment">

        <div class="box-1" data-aos="zoom-in"></div>
        <div class="box-2" data-aos="zoom-in"></div>
        <div class="box-3"></div>

        <form action="" method="POST" class="form-card" data-aos="zoom-in-up">

            <div class="wrapper-block text-center">
                <h3 class="text-headline-small">Commission payment</h3>

                <p class="text-body-medium opacity-75">The platform's commission is 1% and it is a trust in your name.</p>
            </div>

            <div class="form-group">
                <label for="transaction_amount" class="text-body-medium">Transaction amount</label>

                <div class="input-wrapper blur medium">
                    <input type="text" placeholder="Enter the transaction amount" name="" value="" id="transaction_amount" class="text-body-large" required />

                    <div class="state-layer"></div>
                </div>

                <!-- <p class="text-error text-body-medium"></p> -->
            </div>

            <div class="form-group">
                <label for="bank" class="text-body-medium">the bank</label>

                <div class="select-wrapper blur medium">
                    <select name="" id="bank" class="text-body-large">
                        <option value="" selected>Choose the bank</option>
                    </select>

                    <div class="arrow-select">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-down"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6 9l6 6l6 -6" /></svg>
                    </div>
                </div>
            </div>

            <div class="card blur">

                <div class="card-body">

                    <div class="wrapper-block text-center">
                        <h3 class="text-display-small text-linear-gradient">0.00EGP</h3>
    
                        <p class="text-body-medium opacity-75">Commission amount due (1%)</p>
                    </div>

                </div>

            </div>

            <div class="card blur">

                <div class="card-body" style="padding: var(--spacing-4) !important;">

                    <div class="card blur">

                        <div class="card-body" style="padding: var(--spacing-4) !important;">

                            <div class="wrapper-content">
                                <p class="text-body-medium text-capitalize">account name:</p>

                                <p class="text-body-large text-linear-gradient">-----</p>
                            </div>

                        </div>

                    </div>

                    <div class="card blur">

                        <div class="card-body" style="padding: var(--spacing-4) !important;">

                            <div class="wrapper-content">
                                <p class="text-body-medium text-capitalize">IBAN:</p>

                                <p class="text-body-large text-linear-gradient">-----</p>
                            </div>

                        </div>

                    </div>

                    <div class="card blur">

                        <div class="card-body" style="padding: var(--spacing-4) !important;">

                            <div class="wrapper-content">
                                <p class="text-body-medium text-capitalize">Account number:</p>

                                <p class="text-body-large text-linear-gradient">-----</p>
                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <label for="upload_file" class="card blur">

                <div class="card-body">

                    <div class="wrapper-block text-center opacity-75">
                        <div class="icon-big">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-cloud-upload"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M7 18a4.6 4.4 0 0 1 0 -9a5 4.5 0 0 1 11 2h1a3.5 3.5 0 0 1 0 7h-1" /><path d="M9 15l3 -3l3 3" /><path d="M12 12l0 9" /></svg>
                        </div>

                        <p class="text-body-large text-on-background-variant" data-first-name>Select the file</p>
                    </div>

                </div>

                <input type="file" name="" value="" id="upload_file" hidden data-input-file />

                <div class="state-layer"></div>

            </label>

            <button type="submit" class="btn filled medium w-full">
                <p class="text-body-large">Save</p>

                <div class="state-layer"></div>
            </button>

        </form>

    </article>

    <script>
        const $inputFile = document.querySelector("[data-input-file]");
        const $fileName = document.querySelector("[data-first-name]");

        $inputFile.addEventListener("change", () => $fileName.textContent = $inputFile.files[0]?.name || "No file was selected");
    </script>

</body>

</html>
