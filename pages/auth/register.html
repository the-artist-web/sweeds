<body>
    
    <!-- Auth Page -->
    <article class="auth-page">

        <div class="box-1" data-aos="zoom-in"></div>
        <div class="box-2" data-aos="zoom-in"></div>
        <div class="box-3"></div>

        <form action="" method="POST" class="auth-card" data-aos="zoom-in-up">

            <div class="wrapper-block">
                <h3 class="text-headline-small">Create an account</h3>

                <p class="text-body-medium opacity-75">Enter your email below to create your account</p>
            </div>

            <div class="auth-body">

                <div class="form-group">
                    <label for="full_name" class="text-body-medium">Full Name</label>

                    <div class="input-wrapper blur medium">
                        <input type="text" placeholder="Enter your full name" name="" value="" id="full_name" class="text-body-large" required />

                        <div class="state-layer"></div>
                    </div>

                    <!-- <p class="text-error text-body-medium"></p> -->
                </div>

                <div class="form-group">
                    <label for="email_address" class="text-body-medium">Email Address</label>

                    <div class="input-wrapper blur medium">
                        <input type="email" placeholder="Enter your email" name="" value="" id="email_address" class="text-body-large" required />

                        <div class="state-layer"></div>
                    </div>

                    <!-- <p class="text-error text-body-medium"></p> -->
                </div>

                <div class="form-group">
                    <label for="password" class="text-body-medium">Password</label>

                    <div class="input-wrapper blur medium">
                        <input type="password" placeholder="Enter your password" name="" value="" id="password" class="text-body-large" required />

                        <div class="state-layer"></div>
                    </div>

                    <!-- <p class="text-error text-body-medium"></p> -->
                </div>

                <div class="form-group">
                    <label for="confirm_password" class="text-body-medium">Confirm Password</label>

                    <div class="input-wrapper blur medium">
                        <input type="password" placeholder="Enter your confirm password" name="" value="" id="confirm_password" class="text-body-large" required />

                        <div class="state-layer"></div>
                    </div>

                    <!-- <p class="text-error text-body-medium"></p> -->
                </div>

                <button type="submit" class="btn filled medium w-full">
                    <p class="text-body-large">Create an account</p>

                    <div class="state-layer"></div>
                </button>

                <p class="text-body-medium">
                    Already have an account? <a href="../../pages/auth/login.html" class="text-primary hover">Login</a>
                </p>

            </div>

        </form>
        
    </article>

</body>
